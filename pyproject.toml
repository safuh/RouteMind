[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "routemind"
version = "0.1.0"
description = "Agentic multimodal logistics optimization and transportation decision engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
    { name = "Safu Harry" }
]
dependencies = [
    "pydantic>=2.8,<3",
    "ortools>=9.10,<10",
    "networkx>=3.3,<4",
]

[project.optional-dependencies]
agents = [
    "google-adk>=2.0,<3",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
routemind = "routemind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/routemind"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
