name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[agents,dev]"
      - run: ruff check app src/routemind/optimization tests/optimization tests/agent
      - name: Pytest diagnostics
        run: pytest -q > pytest-report.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-report-postpackaging
          path: pytest-report.txt
      - run: pytest
