name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[agents,dev]"
      - run: ruff check app src/routemind tests
      - run: python -c "from app.agent import app, root_agent; print(app.name, root_agent.name)"
      - run: pytest
